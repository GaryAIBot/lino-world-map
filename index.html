<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff4ff">
  <title>Lino's World Map</title>
  <style>
    :root { color-scheme: light; --ink:#17324d; --ocean:#dff4ff; --land:#f3b64e; --land-hover:#ffcf70; --line:#fff8e8; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin:0; overflow:hidden; font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; color:var(--ink); background:var(--ocean); }
    main { height:100%; display:grid; grid-template-rows:auto 1fr; }
    header { position:relative; z-index:2; display:flex; align-items:center; gap:16px; padding:max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.55) 75%, transparent); }
    .title { min-width:0; }
    h1 { margin:0; font-size:clamp(1.25rem, 3vw, 2rem); line-height:1.05; letter-spacing:-.03em; }
    p { margin:.3rem 0 0; font-size:clamp(.76rem, 1.7vw, 1rem); opacity:.72; }
    button { margin-left:auto; flex:none; border:0; border-radius:999px; background:#fff; color:var(--ink); padding:.7rem 1rem; font:700 .86rem/1 system-ui,sans-serif; box-shadow:0 5px 18px rgba(23,50,77,.13); cursor:pointer; }
    button:active { transform:translateY(1px) scale(.98); }
    #map-wrap { position:relative; min-height:0; touch-action:manipulation; }
    svg { display:block; width:100%; height:100%; }
    .sphere { fill:var(--ocean); }
    .country { fill:var(--land); stroke:var(--line); stroke-width:.55px; vector-effect:non-scaling-stroke; cursor:pointer; transition:fill .16s ease, opacity .22s ease; }
    .country:hover, .country:focus-visible { fill:var(--land-hover); outline:none; }
    .country.hidden { fill:transparent; stroke:transparent; opacity:0; }
    .country.hit-target { fill:transparent; stroke:transparent; opacity:0; pointer-events:all; }
    .country.flash { fill:#ff7b6b; }
    #status { position:absolute; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:calc(100% - 32px); padding:.55rem .9rem; border-radius:999px; background:rgba(255,255,255,.9); box-shadow:0 5px 18px rgba(23,50,77,.12); font-weight:750; font-size:clamp(.72rem, 1.7vw, .94rem); white-space:nowrap; pointer-events:none; transition:opacity .25s; }
    #status:empty { opacity:0; }
    @media (max-width:560px) { header { gap:8px; } button { padding:.62rem .78rem; font-size:.77rem; } }
    @media (prefers-reduced-motion:reduce) { .country, #status { transition:none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="title"><h1>Lino's World Map</h1><p>Tap a country to hide it. Tap the empty space to bring it back.</p></div>
      <button id="reset" type="button">Show all</button>
    </header>
    <div id="map-wrap">
      <svg id="map" role="img" aria-label="Interactive map of the countries of the world"></svg>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script src="/assets/d3.min.js"></script>
  <script src="/assets/topojson-client.min.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = 'lino-world-map-hidden-v1';
      const svg = d3.select('#map');
      const wrap = document.querySelector('#map-wrap');
      const status = document.querySelector('#status');
      const reset = document.querySelector('#reset');
      const hidden = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
      let countries = [];
      let projection, path, statusTimer;

      const announce = (message) => {
        status.textContent = message;
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => status.textContent = '', 1500);
      };

      const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify([...hidden]));

      const setCountryState = (selection, country) => {
        const isHidden = hidden.has(String(country.id));
        selection.classed('hidden', isHidden).attr('aria-pressed', String(isHidden));
      };

      const toggle = (event, country) => {
        const id = String(country.id);
        const wasHidden = hidden.has(id);
        wasHidden ? hidden.delete(id) : hidden.add(id);
        save();
        const shape = d3.select(event.currentTarget);
        setCountryState(shape, country);
        announce(`${country.properties.name} ${wasHidden ? 'is back' : 'disappeared'}`);
      };

      const draw = () => {
        if (!countries.length) return;
        const width = wrap.clientWidth;
        const height = wrap.clientHeight;
        svg.attr('viewBox', `0 0 ${width} ${height}`);
        projection = d3.geoNaturalEarth1().fitExtent([[8, 8], [width - 8, height - 8]], {type:'FeatureCollection', features:countries});
        path = d3.geoPath(projection);
        svg.selectAll('path').attr('d', path);
      };

      fetch('/assets/countries-110m.json')
        .then(response => { if (!response.ok) throw new Error('Map failed to load'); return response.json(); })
        .then(world => {
          countries = topojson.feature(world, world.objects.countries).features;
          svg.append('path').datum({type:'Sphere'}).attr('class','sphere');
          svg.selectAll('.country')
            .data(countries)
            .join('path')
            .attr('class','country')
            .attr('tabindex','0')
            .attr('role','button')
            .attr('aria-label', d => d.properties.name)
            .on('click', toggle)
            .on('keydown', (event, d) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(event, d); } })
            .each(function(d) { setCountryState(d3.select(this), d); });
          draw();
        })
        .catch(() => announce('The map could not load. Please refresh.'));

      reset.addEventListener('click', () => {
        hidden.clear(); save();
        svg.selectAll('.country').each(function(d) { setCountryState(d3.select(this), d); });
        announce('Every country is back');
      });

      new ResizeObserver(draw).observe(wrap);
    })();
  </script>
</body>
</html>
